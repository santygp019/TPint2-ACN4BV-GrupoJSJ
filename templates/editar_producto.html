{% extends "base.html" %}

{% block title %}Editar Producto - JSJ{% endblock %}

{% block content %}
<div class="ventas-container form-centrado">
    <div class="form-card">
        <h2 class="titulo-seccion">Editar Producto</h2>

        {% if error %}
        <p class="alerta-error">{{ error }}</p>
        {% endif %}

        <form action="" method="post" class="form-vertical">
            <div>
                <label class="form-label">Nombre del Producto:</label>
                <input type="text" name="nombre" class="ventas-input input-full" value="{{ producto.nombre }}" required>
            </div>

            <div>
                <label class="form-label">Precio ($):</label>
                <input type="number" step="0.01" min="0.01" name="precio" class="ventas-input input-full" value="{{ producto.precio or '' }}" required>
            </div>

            <div>
                <label class="form-label">Stock Actual:</label>
                <input type="number" min="0" name="stock" class="ventas-input input-full" value="{{ producto.stock if producto.stock is not none else ''  }}" required>
            </div>

            <div class="acciones-form">
                <button type="submit" class="ventas-btn btn-primario-full">Guardar Cambios</button>
                <a href="{{ url_for('home') }}" class="ventas-btn btn-secundario">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
