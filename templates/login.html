{% extends "base.html" %}

{% block title %}Iniciar sesión - JSJ{% endblock %}

{% block content %}
<div class="ventas-container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">

    <div style="background-color: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; border-top: 4px solid var(--hw-orange);">
        <h2 style="margin-top: 0; color: var(--hw-dark); text-align: center;">Iniciar sesión</h2>

        {% with mensajes = get_flashed_messages() %}
          {% for m in mensajes %}
            <p style="color: #b91c1c; font-weight: bold; text-align: center;">{{ m }}</p>
          {% endfor %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="post" style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px; color: var(--hw-gray);">Email</label>
                <input type="email" name="email" class="ventas-input" style="width: 100%; padding: 10px;" required>
            </div>
            <div>
                <label style="font-weight: bold; display: block; margin-bottom: 8px; color: var(--hw-gray);">Clave</label>
                <input type="password" name="clave" class="ventas-input" style="width: 100%; padding: 10px;" required>
            </div>

            <button type="submit" class="ventas-btn" style="padding: 12px; font-size: 1.1em;">Ingresar</button>
        </form>
    </div>

</div>
{% endblock %}
