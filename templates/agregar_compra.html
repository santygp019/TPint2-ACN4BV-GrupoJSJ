<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Compra</title>
</head>
<body>
    <h1>Registrar Compra a Proveedor</h1>
    
    {% if mensaje %}
        <p><b>{{ mensaje }}</b></p>
    {% endif %}

    <form action="/compras/nueva" method="post">
        <label>Proveedor:</label>
        <select name="id_proveedor" required>
            {% for prov in proveedores %}
                <option value="{{ prov.id_proveedor }}">{{ prov.nombre }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Producto comprado:</label>
        <select name="id_producto" required>
            {% for prod in productos %}
                <option value="{{ prod.id_producto }}">{{ prod.nombre }} (Stock actual: {{ prod.stock }})</option>
            {% endfor %}
        </select>
        <br><br>

        <label>Cantidad:</label>
        <input type="number" name="cantidad" min="1" required>
        <br><br>

        <label>Precio de compra (Total o por unidad):</label>
        <input type="number" step="0.01" name="precio_compra" required>
        <br><br>

        <button type="submit">Registrar Compra y Actualizar Stock</button>
    </form>

    <br>
    <a href="{{ url_for('home') }}">Volver al Inicio</a>
</body>
</html>
