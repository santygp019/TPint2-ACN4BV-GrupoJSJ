{% extends "base.html" %}

{% block title %}Agregar Producto - JSJ{% endblock %}

{% block content %}
<div class="ventas-container form-centrado">
    <div class="form-card">
        <h2 class="titulo-seccion">Agregar Nuevo Producto</h2>

        {% if error %}
        <div class="alerta-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('cargarProducto') }}" method="post" class="form-vertical">
            <div>
                <label class="form-label">Nombre del producto:</label>
                <input type="text" name="nombre" class="ventas-input input-full" required>
            </div>

            <div>
                <label class="form-label">Precio del producto ($):</label>
                <input type="number" step="0.01" min="0.01" name="precio" class="ventas-input input-full" required>
            </div>

            <div>
                <label class="form-label">Stock inicial:</label>
                <input type="number" min="0" name="stock" class="ventas-input input-full" required>
            </div>

            <div>
                <label class="form-label">Categoría:</label>
                <select name="id_categoria" class="ventas-input input-full" required>
                    <option value="" disabled selected>Seleccione una categoría</option>
                    {% for cat in categorias %}
                    <option value="{{ cat.id_categoria }}">{{ cat.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="acciones-form">
                <button type="submit" class="ventas-btn btn-primario-full">Agregar Producto</button>
                <a href="{{ url_for('home') }}" class="ventas-btn btn-secundario">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
