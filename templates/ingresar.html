<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingresar</title>
</head>
<body>
    <h1>Ingresar como Cliente</h1>

    {% if error %}
    <p style="color: red;">{{error}}</p>
    {% endif %}

    <form action="" method="post">
        <label>Cliente</label>
        <select name="id_cliente">
            {% for cli in clientes %}
            <option value="{{cli.id_cliente}}">{{cli.nombre}}</option>
            {% endfor %}
        </select>
        <button type="submit">Ingresar</button>
    </form>

    <a href="{{url_for('home')}}">Volver al Inicio</a>
</body>
</html>
