{% extends "base.html" %}

{% block title %}Editar Cliente - JSJ{% endblock %}

{% block content %}
<div class="ventas-container form-centrado">
    <div class="form-card">
        <h2 class="titulo-seccion">Actualizar Datos</h2>

        {% if error %}
        <p class="alerta-error">{{ error }}</p>
        {% endif %}

        <form action="" method="post" class="form-vertical">
            <div>
                <label class="form-label">Nombre Completo:</label>
                <input type="text" name="nombre" class="ventas-input input-full" value="{{ cliente.nombre }}" required>
            </div>

            <div>
                <label class="form-label">Email:</label>
                <input type="email" name="email" class="ventas-input input-full" value="{{ cliente.email or '' }}">
            </div>

            <div>
                <label class="form-label">Teléfono:</label>
                <input type="text" name="telefono" class="ventas-input input-full" value="{{ cliente.telefono or '' }}">
            </div>

            <div class="acciones-form">
                <button type="submit" class="ventas-btn btn-primario-full">Guardar Cambios</button>
                <a href="{{ url_for('cargarCliente') }}" class="ventas-btn btn-secundario">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
