<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Productos</title>
</head>
<body>
        <h1>Lista de Productos</h1>
    <ul>
        {% for pro in productos %}
        <li>{{pro.nombre}} - ${{pro.precio}} - {{pro.categoria.nombre}}</li>
        {% endfor %}
    </ul>
</body>
</html>
