<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Pedidos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="hw-main-content">
        <h2>Catálogo de Productos - Retiro en Local</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Stock Disponible</th>
                    <th>Realizar Pedido</th>
                </tr>
            </thead>
            <tbody>
             {% for pro in productos %}
             <tr>
                <td>{{ pro.nombre }}</td>
                <td>${{ pro.precio }}</td>
                <td>{{ pro.stock }}</td>
                <td>
                    <form action="{{ url_for('pedidos.catalogo_cliente') }}" method="POST">
                        <input type="hidden" name="id_producto" value="{{ pro.id_producto }}">
                        
                        <select name="id_cliente" required>
                            <option value="" disabled selected>Seleccione Cliente</option>
                            {% for cli in clientes %}
                                <option value="{{ cli.id_cliente }}">{{ cli.nombre }}</option>
                            {% endfor %}
                        </select>
                        
                        <input type="number" name="cantidad" min="1" max="{{ pro.stock }}" value="1" required>
                        <button type="submit">Reservar para Retiro</button>
                    </form>
                </td>
             </tr>
             {% endfor %}       
            </tbody>
        </table>
        <br>
        <a href="{{ url_for('home') }}">Volver al Inicio</a>
    </div>
</body>
</html>
